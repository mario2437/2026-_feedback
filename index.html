<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>기획서 피드백</title>
<meta name="description" content="머신러닝프로젝트 과제 01 프로젝트 기획서 개별 피드백 열람 페이지">
<style>
:root{--bg:#f6f7f9;--card:#ffffff;--fg:#1d2126;--muted:#5e6673;--line:#d9dee5;--accent:#1f5fbf;--accent-fg:#ffffff;--warn:#b3261e;--ok:#1e7a46;--th:#eef2f7}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#15181c;--card:#1e2328;--fg:#e8eaed;--muted:#a0a8b3;--line:#333a43;--accent:#6ea2ff;--accent-fg:#0d1b33;--warn:#ff8a80;--ok:#7fd49a;--th:#262c33}}
:root[data-theme="dark"]{--bg:#15181c;--card:#1e2328;--fg:#e8eaed;--muted:#a0a8b3;--line:#333a43;--accent:#6ea2ff;--accent-fg:#0d1b33;--warn:#ff8a80;--ok:#7fd49a;--th:#262c33}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;line-height:1.6}
main{max-width:860px;margin:0 auto;padding:32px 16px 64px}
h1.site{font-size:1.35rem;margin:0 0 4px}
p.sub{color:var(--muted);margin:0 0 24px;font-size:.95rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px}
form{display:grid;gap:12px}
label{font-size:.9rem;color:var(--muted)}
input{width:100%;padding:12px 14px;font-size:1.05rem;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg)}
input:focus{outline:2px solid var(--accent);outline-offset:1px}
button{padding:12px 18px;font-size:1rem;border:0;border-radius:8px;background:var(--accent);color:var(--accent-fg);cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){.row{grid-template-columns:1fr}}
#msg{min-height:1.4em;margin:8px 0 0;font-size:.95rem}
#msg.err{color:var(--warn)} #msg.ok{color:var(--ok)}
#out{display:none;margin-top:24px}
#out h1{font-size:1.4rem;margin:0 0 12px;padding-bottom:8px;border-bottom:2px solid var(--line)}
#out h2{font-size:1.1rem;margin:28px 0 10px;color:var(--accent)}
#out p{margin:0 0 10px}
#out ol{padding-left:1.4em} #out li{margin:6px 0}
.tw{overflow-x:auto}
#out table{width:100%;border-collapse:collapse;margin:8px 0 12px;font-size:.95rem}
#out th,#out td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
#out th{background:var(--th)}
#out td:nth-child(-n+2),#out th:nth-child(-n+2){white-space:nowrap}
@media (max-width:520px){#out td:first-child,#out th:first-child{white-space:normal}}
.tools{display:flex;gap:8px;justify-content:flex-end;margin-top:20px}
.tools button{background:transparent;color:var(--accent);border:1px solid var(--line)}
footer{color:var(--muted);font-size:.85rem;margin-top:32px}
@media print{form,.tools,footer,p.sub{display:none} .card{border:0;padding:0} body{background:#fff;color:#000}}
</style>
</head>
<body>
<main>
<h1 class="site">머신러닝프로젝트 기획서 피드백</h1>
<p class="sub">과제 01 프로젝트 기획서에 대한 개별 피드백입니다. 학번과 이름을 입력하면 본인 피드백만 열립니다.</p>
<section class="card">
<form id="f" autocomplete="off">
<div class="row">
<div><label for="sid">학번</label><input id="sid" inputmode="numeric" placeholder="예: 23016060" required></div>
<div><label for="name">이름</label><input id="name" placeholder="예: 홍길동" required></div>
</div>
<button id="btn" type="submit">피드백 열기</button>
<p id="msg"></p>
</form>
<article id="out"></article>
<div class="tools" id="tools" style="display:none">
<button type="button" id="dl">md 파일로 저장</button>
<button type="button" id="pr">인쇄</button>
</div>
</section>
<footer>이 페이지에는 암호화된 내용만 올라가 있으며, 복호화는 사용자의 브라우저 안에서만 이루어집니다. 질문은 수업 시간 또는 교수 연구실로 문의하세요.</footer>
</main>

const ITER = 150000;
const enc = new TextEncoder(), dec = new TextDecoder();
const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const normSid = s => s.replace(/\D/g, "");
const normName = s => s.normalize("NFC").replace(/\s+/g, "");
async function sha256hex(s){ const h = await crypto.subtle.digest("SHA-256", enc.encode(s)); return [...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,"0")).join("").slice(0,32); }
async function decrypt(entry, sid, name){
  const km = await crypto.subtle.importKey("raw", enc.encode(sid + name), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b64d(entry.s), iterations:ITER, hash:"SHA-256"}, km, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64d(entry.v)}, key, b64d(entry.c));
  return dec.decode(pt);
}
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function render(md){
  const lines = md.replace(/\r/g,"").split("\n"); let html = "", i = 0;
  while (i < lines.length){
    const l = lines[i];
    if (!l.trim()){ i++; continue; }
    if (l.startsWith("## ")){ html += `<h2>${esc(l.slice(3))}</h2>`; i++; continue; }
    if (l.startsWith("# ")){ html += `<h1>${esc(l.slice(2))}</h1>`; i++; continue; }
    if (l.trim().startsWith("|")){
      const rows = []; while (i < lines.length && lines[i].trim().startsWith("|")){ rows.push(lines[i]); i++; }
      const cells = r => r.trim().replace(/^\||\|$/g,"").split("|").map(c=>esc(c.trim()));
      const data = rows.filter(r => !/^\|?[\s:|-]+\|?$/.test(r.trim()));
      if (!data.length){ continue; }
      html += "<div class=\"tw\"><table><thead><tr>" + cells(data[0]).map(c=>`<th>${c}</th>`).join("") + "</tr></thead><tbody>";
      for (const r of data.slice(1)) html += "<tr>" + cells(r).map(c=>`<td>${c}</td>`).join("") + "</tr>";
      html += "</tbody></table></div>"; continue;
    }
    if (/^\d+\.\s/.test(l)){
      html += "<ol>"; while (i < lines.length && /^\d+\.\s/.test(lines[i])){ html += `<li>${esc(lines[i].replace(/^\d+\.\s/,""))}</li>`; i++; }
      html += "</ol>"; continue;
    }
    const para = []; while (i < lines.length && lines[i].trim() && !lines[i].startsWith("#") && !lines[i].trim().startsWith("|") && !/^\d+\.\s/.test(lines[i])){ para.push(lines[i]); i++; }
    html += `<p>${para.map(esc).join("<br>")}</p>`;
  }
  return html;
}
let currentMd = "", currentName = "";
const $ = id => document.getElementById(id);
async function open(sidRaw, nameRaw){
  const sid = normSid(sidRaw), name = normName(nameRaw);
  const msg = $("msg"), out = $("out"), btn = $("btn");
  out.style.display = "none"; $("tools").style.display = "none"; msg.className = "";
  if (!sid || !name){ msg.className = "err"; msg.textContent = "학번과 이름을 모두 입력하세요."; return; }
  btn.disabled = true; msg.textContent = "확인 중입니다.";
  try {
    const entry = DATA[await sha256hex(sid)];
    if (!entry){ throw new Error("nosid"); }
    const md = await decrypt(entry, sid, name);
    currentMd = md; currentName = name;
    out.innerHTML = render(md); out.style.display = "block"; $("tools").style.display = "flex";
    msg.className = "ok"; msg.textContent = "피드백을 불러왔습니다.";
  } catch (e) {
    msg.className = "err";
    msg.textContent = e.message === "nosid" ? "해당 학번의 피드백이 없습니다. 학번을 확인하거나 교수에게 문의하세요." : "학번 또는 이름이 맞지 않습니다. 띄어쓰기 없이 입력하세요.";
  } finally { btn.disabled = false; }
}
$("f").addEventListener("submit", e => { e.preventDefault(); open($("sid").value, $("name").value); });
$("dl").addEventListener("click", () => { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([currentMd], {type:"text/markdown;charset=utf-8"})); a.download = `기획서_피드백_${currentName}.md`; a.click(); URL.revokeObjectURL(a.href); });
$("pr").addEventListener("click", () => window.print());

</script>
